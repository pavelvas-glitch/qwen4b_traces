[project]
name = "qwen4b-traces"
version = "0.1.0"
description = "Reproducible reasoning trace collection"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "huggingface-hub>=0.34,<1",
    "transformers>=4.55.2,<4.56",
    "jinja2>=3.1,<4",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
gpu = ["vllm==0.10.2; sys_platform == 'linux'"]

[project.scripts]
tracegen = "tracegen.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracegen"]
